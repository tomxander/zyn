[project]
name = "zyn-harness"
version = "0.1.0"
description = "Zyn: prototype harness for automotive engineering workflows."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0,<2",
    "ollama>=0.4",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "docling>=2.100",
    "openpyxl>=3.1",
    "reqif>=0.0.40",
    "cantools>=45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "python-docx>=1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

