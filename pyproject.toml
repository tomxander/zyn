[project]
name = "zyn-harness"
version = "0.2.0"
description = "Zyn: the checker for AI-made automotive engineering work (prototype)."
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
classifiers = [
    "Private :: Do Not Upload",
]
requires-python = ">=3.11"
# The light install: every code check, the review screen, the MCP server and both model
# providers. Small enough to install in a minute; no machine-learning stack.
dependencies = [
    "anthropic>=1.0,<2",
    "httpx>=0.27",
    "ollama>=0.4",
    "pydantic>=2.7",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "reqif>=0.0.40",
    "cantools>=45",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Reads PDF and Word specifications. Pulls in a large machine-learning stack (several GB).
docs = ["docling>=2.100"]
# The legacy Streamlit review screen.
classic = ["streamlit>=1.40"]
team = ["psycopg[binary]>=3.2", "psycopg_pool>=3.2", "authlib>=1.3", "itsdangerous>=2.1"]
bedrock = ["boto3>=1.34"]
vertex = ["google-auth>=2.30"]
all = ["zyn-harness[docs,classic,team,bedrock,vertex]"]
dev = ["zyn-harness[docs,classic,team,bedrock,vertex]", "pytest>=8", "ruff>=0.6", "python-docx>=1.1"]

[project.scripts]
zyn = "harness.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.setuptools.package-data]
harness = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
