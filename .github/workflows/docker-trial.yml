name: Docker Trial Verification

on:
  push:
    paths:
      - 'Dockerfile'
      - 'compose*.yaml'
      - 'deploy/**'
      - 'harness/**'
      - 'web/**'
      - 'scripts/verify-trial-docker.sh'
      - '.github/workflows/docker-trial.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'compose*.yaml'
      - 'deploy/**'
      - 'harness/**'
      - 'web/**'
      - 'scripts/verify-trial-docker.sh'
      - '.github/workflows/docker-trial.yml'

permissions:
  contents: read

jobs:
  test-trial-compose:
    name: Verify Trial Compose on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run end-to-end trial verification
        run: |
          chmod +x scripts/verify-trial-docker.sh
          ./scripts/verify-trial-docker.sh
