name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zyn_test
          POSTGRES_DB: zyn_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Verify Tag Matches pyproject.toml Version
        run: |
          PYPROJECT_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${PYPROJECT_VERSION}" ]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match pyproject.toml version v${PYPROJECT_VERSION}"
            exit 1
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77"
          pip install wheel
          pip install -e ".[dev]"

      - name: Build Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify Web UI Build Output
        run: |
          if [ ! -d "web/dist" ] || [ ! -f "web/dist/index.html" ]; then
            echo "Error: web/dist missing or incomplete after web build"
            exit 1
          fi

      - name: Run linter and tests
        env:
          ZYN_TEST_PG_URL: postgresql://zyn_test@localhost:5432/zyn_test
        run: |
          ruff check harness/ tests/ evals/
          pytest -q

      - name: Build Python Wheel
        run: |
          python -m pip install --upgrade pip "setuptools>=77"
          python -m pip wheel . --no-deps --no-build-isolation -w dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2.0.8
        with:
          files: dist/*.whl
          generate_release_notes: true
          draft: false
          prerelease: false
