services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zyn
      POSTGRES_USER: zyn_admin
      POSTGRES_PASSWORD: ${ZYN_DATABASE_ADMIN_PASSWORD:-trial-only-admin-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyn_admin -d zyn"]
      interval: 5s
      timeout: 5s
      retries: 5

  upgrade:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ZYN_DATABASE_ADMIN_URL: postgresql://zyn_admin:${ZYN_DATABASE_ADMIN_PASSWORD:-trial-only-admin-password}@db:5432/zyn
      ZYN_DATABASE_APP_PASSWORD: ${ZYN_DATABASE_PASSWORD:-trial-only-app-password}
    command: ["zyn", "upgrade", "--admin-url", "postgresql://zyn_admin:${ZYN_DATABASE_ADMIN_PASSWORD:-trial-only-admin-password}@db:5432/zyn", "--app-user", "zyn"]

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/trial-realm.json:/opt/keycloak/data/import/trial-realm.json:ro

  zyn:
    build: .
    restart: unless-stopped
    depends_on:
      upgrade:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:8600:8600"
    environment:
      ZYN_DATABASE_PASSWORD: ${ZYN_DATABASE_PASSWORD:-trial-only-app-password}
      ZYN_SESSION_SECRET: ${ZYN_SESSION_SECRET:-trial-only-session-secret-at-least-32-chars-long}
      ZYN_OIDC_CLIENT_SECRET: ${ZYN_OIDC_CLIENT_SECRET:-zyn-trial-client-secret}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./deploy/team.trial.yaml:/data/config.yaml:ro
      - zyn_data:/data

volumes:
  pgdata:
  zyn_data:
